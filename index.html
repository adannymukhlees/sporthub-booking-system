<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportHub - Equipment Booking System Login</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --navy-primary: #0a192f;
            --navy-secondary: #172a45;
            --navy-accent: #1e3a8a;
        }

        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333333;
        }

        /* Dark Navy Navbar */
        .navbar-custom {
            background-color: var(--navy-primary);
        }

        .login-card {
            max-width: 440px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(10, 25, 47, 0.12);
            background-color: #ffffff;
        }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .btn-navy {
            background-color: var(--navy-primary);
            color: #ffffff;
            border: none;
            transition: all 0.2s ease-in-out;
        }

        .btn-navy:hover {
            background-color: var(--navy-secondary);
            color: #ffffff;
        }

        .icon-header {
            color: var(--navy-primary);
        }

        .text-navy {
            color: var(--navy-primary);
        }

        footer {
            background-color: var(--navy-primary);
        }
    </style>
</head>
<body>

    <!-- Dark Navy Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                <i class="bi bi-trophy-fill text-white fs-4 me-2"></i>
                <span class="fs-4">SportHub</span>
            </a>
        </div>
    </nav>

    <!-- Main Container / Login Card -->
    <div class="main-container">
        <div class="card login-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="mb-2">
                    <i class="bi bi-person-badge-fill display-4 icon-header"></i>
                </div>
                <h3 class="fw-bold text-navy mb-1">Welcome Back</h3>
                <p class="text-muted small">Campus Sports Equipment Booking Portal</p>
            </div>

            <!-- Error Feedback Alert (Hidden by default) -->
            <div id="alertBox" class="alert alert-danger d-none align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <div id="alertMessage">Invalid username or password!</div>
            </div>

            <!-- Success Feedback Alert (Hidden by default) -->
            <div id="successBox" class="alert alert-success d-none align-items-center" role="alert">
                <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                <div>Login successful! Redirecting...</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold small text-secondary">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-navy"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-navy"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                    </div>
                </div>

                <div class="mb-4 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="small text-navy text-decoration-none fw-semibold" onclick="alert('Demo Mode: Please use the test credentials provided below.')">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-navy w-100 py-2 fw-semibold rounded-2">
                    Sign In <i class="bi bi-box-arrow-in-right ms-1"></i>
                </button>
            </form>

            <!-- Test Credentials Box for Rubric Evaluation -->
            <div class="mt-4 pt-3 border-top text-center text-muted small bg-light p-2 rounded-2">
                <div class="fw-bold mb-1 text-secondary">Test Credentials (Evaluation):</div>
                <div>Admin: <code>admin</code> / <code>admin123</code></div>
                <div>Student: <code>student</code> / <code>user123</code></div>
            </div>
        </div>
    </div>

    <!-- Dark Navy Footer -->
    <footer class="text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 small text-white-50">&copy; 2026 SportHub Equipment Booking System. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript Validation & Authentication Simulation -->
    <script>
        function handleLogin(event) {
            event.preventDefault(); // Prevents standard page submit

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('alertBox');
            const alertMessage = document.getElementById('alertMessage');
            const successBox = document.getElementById('successBox');

            // Reset alerts
            alertBox.classList.add('d-none');
            successBox.classList.add('d-none');

            // Hardcoded Authentication Logic (Meets Rubric 3.1a & 3.1b)
            if (
                (usernameInput === 'admin' && passwordInput === 'admin123') ||
                (usernameInput === 'student' && passwordInput === 'user123')
            ) {
                // Show success feedback
                successBox.classList.remove('d-none');
                
                // Store user session in LocalStorage
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', usernameInput);

                // Redirect to Dashboard after 1 second
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } else {
                // Show clear error feedback for wrong credentials
                alertMessage.textContent = 'Invalid username or password! Please try again.';
                alertBox.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
